<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoices — L-Suite</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Invoices</h1>
    <div id="msg"></div>
    <div class="card table-wrap"><table>
      <thead><tr><th>Number</th><th>Customer</th><th>Date</th><th>Due</th><th class="num">Total</th><th class="num">Outstanding</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>

    <div class="card">
      <h3>New invoice</h3>
      <form id="add">
        <div class="fields">
          <div class="field"><label>Invoice number</label><input name="invoice_number" required /></div>
          <div class="field"><label>Customer</label><input name="customer_name" required /></div>
          <div class="field"><label>Customer email</label><input name="customer_email" type="email" /></div>
          <div class="field"><label>Invoice date</label><input name="invoice_date" type="date" required /></div>
          <div class="field"><label>Due date</label><input name="due_date" type="date" /></div>
          <div class="field"><label>VAT %</label><input name="tax_rate" type="number" step="0.01" value="15" /></div>
        </div>
        <h3>Items</h3>
        <div id="items"></div>
        <div class="row" style="margin-bottom:1rem"><button type="button" id="add-item" class="secondary small">+ Item</button></div>
        <button type="submit">Create invoice</button>
      </form>
    </div>
  </main>
  <script type="module">
    import { api } from "/js/api.js";
    import { $, $$, badge, empty, esc, flash, money, onSubmit, page } from "/js/ui.js";
    page();

    const STATUSES = ["draft", "sent", "paid", "overdue", "cancelled"];
    const itemRow = () => `<div class="row item" style="margin-bottom:0.5rem">
      <input class="grow" data-k="description" placeholder="Description" required />
      <input data-k="quantity" type="number" step="0.01" value="1" style="width:6rem" />
      <input data-k="unit_price" type="number" step="0.01" placeholder="Unit price" style="width:8rem" required /></div>`;
    $("#items").innerHTML = itemRow();
    $("#add-item").addEventListener("click", () => $("#items").insertAdjacentHTML("beforeend", itemRow()));

    async function load() {
      const rows = await api.invoices();
      $("#rows").innerHTML = rows.map(i => `<tr>
        <td>${esc(i.invoice_number)}</td><td>${esc(i.customer_name)}</td><td>${i.invoice_date}</td><td>${i.due_date || ""}</td>
        <td class="num">${money(i.total_amount)}</td><td class="num">${money(i.outstanding_amount)}</td>
        <td><select class="status" data-id="${i.id}">${STATUSES.map(s => `<option ${s === i.status ? "selected" : ""}>${s}</option>`).join("")}</select>
          ${i.is_overdue ? badge("overdue", "err") : ""}</td>
        <td class="row">${i.is_paid ? "" : `<button class="secondary small paid" data-id="${i.id}" data-total="${i.total_amount}">Mark paid</button>`}
          <button class="secondary small del" data-id="${i.id}">Delete</button></td></tr>`).join("") || empty(8, "No invoices yet.");
      $$(".status").forEach(s => s.addEventListener("change", () => save(s.dataset.id, { status: s.value })));
      $$(".paid").forEach(b => b.addEventListener("click", () => save(b.dataset.id, { paid_amount: b.dataset.total, status: "paid" })));
      $$(".del").forEach(b => b.addEventListener("click", async () => {
        if (!confirm("Delete invoice?")) return;
        try { await api.deleteInvoice(b.dataset.id); load(); } catch (e) { flash(e.message, "err"); }
      }));
    }
    async function save(id, body) {
      try { await api.updateInvoice(id, body); flash("Saved."); load(); } catch (e) { flash(e.message, "err"); }
    }

    onSubmit($("#add"), async (d, e) => {
      const items = $$(".item").map(r => Object.fromEntries($$("input", r).map(i => [i.dataset.k, i.value])))
        .filter(i => i.description && i.unit_price);
      await api.createInvoice({ ...d, due_date: d.due_date || null, items });
      e.target.reset();
      $("#items").innerHTML = itemRow();
      flash("Invoice created.");
      load();
    });
    load().catch(e => flash(e.message, "err"));
  </script>
</body>
</html>
