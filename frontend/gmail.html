<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Import — L-Suite</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Import statements</h1>
    <div id="msg"></div>

    <div class="card">
      <h3>Gmail</h3>
      <p id="status" class="muted">Checking…</p>
      <div class="row">
        <button id="btn-connect" hidden>Connect Gmail</button>
        <button id="btn-import" hidden>Import statements from Gmail</button>
        <button id="btn-disconnect" class="danger" hidden>Disconnect</button>
      </div>
    </div>

    <div class="card">
      <h3>Upload PDF statement(s)</h3>
      <form id="pdf-form">
        <div class="fields">
          <div class="field"><label>Bank</label>
            <select name="bank_name"><option value="capitec">Capitec</option><option value="tymebank">TymeBank</option><option value="gotyme">GoTyme</option><option value="other">Other</option></select>
          </div>
          <div class="field"><label>PDF password (if any)</label><input name="pdf_password" type="password" autocomplete="off" /></div>
        </div>
        <div class="field"><input type="file" name="pdf_files" accept=".pdf" multiple required /></div>
        <button type="submit">Upload PDF(s)</button>
      </form>
      <div id="pdf-progress" style="margin-top:1rem"></div>
    </div>

    <div class="card">
      <h3>Upload CSV</h3>
      <form id="csv-form">
        <div class="field"><input type="file" name="csv_file" accept=".csv" required /></div>
        <label class="check"><input type="checkbox" name="create_statement" checked /> Record as a statement</label>
        <button type="submit">Upload CSV</button>
      </form>
      <p><a href="#" id="template">Download CSV template</a></p>
    </div>

    <div class="card">
      <h3>Bulk CSV import</h3>
      <form id="bulk-form">
        <div class="field"><input type="file" name="csv_files" accept=".csv" multiple required /></div>
        <button type="submit">Import all</button>
      </form>
    </div>

    <h2>Recent PDF jobs</h2>
    <div class="card table-wrap"><table>
      <thead><tr><th>Files</th><th>Bank</th><th>Status</th><th class="num">Found</th><th class="num">Saved</th><th class="num">Skipped</th></tr></thead>
      <tbody id="jobs"></tbody>
    </table></div>
  </main>
  <script type="module">
    import { api } from "/js/api.js";
    import { $, action, badge, download, empty, esc, flash, onSubmit, page, param, poll } from "/js/ui.js";
    page();

    const oauthErrors = { oauth_failed: "Google sign-in was cancelled.", invalid_state: "Link expired — try connecting again.", token_exchange: "Google rejected the token exchange." };
    if (param("error")) flash(oauthErrors[param("error")] || "Gmail connection failed.", "err");
    if (param("connected")) flash("Gmail connected.");

    async function refresh() {
      const s = await api.gmailStatus();
      $("#status").textContent = s.connected ? `Connected since ${String(s.connected_since).slice(0, 10)}` :
        s.configured ? "Not connected" : "Google OAuth isn't configured on the server.";
      $("#btn-connect").hidden = s.connected || !s.configured;
      $("#btn-import").hidden = $("#btn-disconnect").hidden = !s.connected;
    }

    async function loadJobs() {
      const jobs = await api.pdfJobs();
      const kind = { done: "ok", failed: "err" };
      $("#jobs").innerHTML = jobs.slice(0, 10).map(j => `<tr><td>${esc(j.filename)}${j.error_message ? `<br><small class="muted">${esc(j.error_message)}</small>` : ""}</td>
        <td>${esc(j.bank_name)}</td><td>${badge(j.status, kind[j.status] || "warn")}</td>
        <td class="num">${j.transactions_found}</td><td class="num">${j.transactions_saved}</td><td class="num">${j.transactions_skipped}</td></tr>`).join("") || empty(6, "No PDF uploads yet.");
    }

    action($("#btn-connect"), async () => { location.href = (await api.gmailConnect()).auth_url; });
    action($("#btn-disconnect"), async () => { await api.gmailDisconnect(); flash("Gmail disconnected."); refresh(); });
    action($("#btn-import"), async () => {
      flash("Searching Gmail…", "warn");
      flash((await api.importStatements()).message + " Parse them on the Statements page.");
    });

    onSubmit($("#pdf-form"), async (_, e) => {
      const { job_id } = await api.uploadPdf(new FormData(e.target));
      const out = $("#pdf-progress");
      const job = await poll(() => api.pdfStatus(job_id), s => ["done", "failed"].includes(s.status), s => {
        out.innerHTML = `<div class="msg warn">${esc(s.status)} — ${s.processed_files}/${s.total_files} files, ${s.transactions_saved} saved, ${s.transactions_skipped} duplicates skipped</div>`;
      });
      out.innerHTML = `<div class="msg ${job.status === "done" ? "ok" : "err"}">${job.status === "done" ? "Done" : "Failed"} — ${job.transactions_saved} transactions saved, ${job.transactions_skipped} skipped.${job.error_message ? " " + esc(job.error_message) : ""}</div>`;
      e.target.reset();
      loadJobs();
    });

    onSubmit($("#csv-form"), async (_, e) => {
      const fd = new FormData(e.target);
      fd.set("create_statement", e.target.elements.create_statement.checked ? "on" : "");
      flash((await api.uploadCsv(fd)).message);
      e.target.reset();
    });
    onSubmit($("#bulk-form"), async (_, e) => {
      const r = await api.bulkCsv(new FormData(e.target));
      flash(r.message + (r.errors.length ? " Errors: " + r.errors.join("; ") : ""), r.errors.length ? "warn" : "ok");
      e.target.reset();
    });
    $("#template").addEventListener("click", (e) => {
      e.preventDefault();
      download(api.csvTemplate(), "transaction_template.csv").catch(err => flash(err.message, "err"));
    });

    refresh().catch(e => flash(e.message, "err"));
    loadJobs().catch(() => {});
  </script>
</body>
</html>
