<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statements — C.T.H.A.I</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Statements</h1>
    <div id="msg"></div>

    <div id="inbox-card" class="card table-wrap" hidden>
      <h3>Inbox — needs a company</h3>
      <table>
        <thead><tr><th>Email</th><th>Received</th><th>Assign to</th><th></th></tr></thead>
        <tbody id="inbox"></tbody>
      </table>
    </div>

    <h2 id="company-title"></h2>
    <div class="card table-wrap"><table>
      <thead><tr><th>Statement</th><th>Bank account</th><th>Received</th><th>State</th><th class="num">Txns</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </main>
  <script type="module">
    import { api } from "/js/api.js";
    import { $, $$, badge, day, empty, esc, flash, page } from "/js/ui.js";
    const { companies, current } = await page();
    $("#company-title").textContent = `${current.name} statements`;
    const accounts = await api.accounts();
    const acctName = (id) => accounts.find(a => a.id === id)?.account_name || "—";

    async function loadInbox() {
      const items = await api.inbox();
      $("#inbox-card").hidden = !items.length;
      $("#inbox").innerHTML = items.map(s => `<tr>
        <td>${esc(s.subject)}<br><small class="muted">${esc(s.sender)}</small></td><td>${day(s.received_date)}</td>
        <td><select class="assign" data-id="${s.id}"><option value="">Choose…</option>${companies.filter(c => c.is_active).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></td>
        <td><button class="secondary small del" data-id="${s.id}">Ignore</button></td></tr>`).join("");
      $$(".assign").forEach(sel => sel.addEventListener("change", async () => {
        if (!sel.value) return;
        try { await api.assignStatement(sel.dataset.id, { client_id: Number(sel.value) }); flash("Assigned."); loadInbox(); load(); }
        catch (e) { flash(e.message, "err"); }
      }));
      bindDelete();
    }

    async function load() {
      const rows = await api.statements();
      const state = (s) => badge(s.state, s.state === "parsed" ? "ok" : s.state === "error" ? "err" : s.state === "locked" ? "warn" : "");
      $("#rows").innerHTML = rows.map(s => `<tr>
        <td>${esc(s.subject)}<br><small class="muted">${esc(s.source === "gmail" ? s.sender : "Uploaded")}</small>${s.error_message ? `<br><small class="muted">${esc(s.error_message)}</small>` : ""}</td>
        <td>${s.source === "gmail" && !s.transaction_count
          ? `<select class="ba" data-id="${s.id}"><option value="">—</option>${accounts.map(a => `<option value="${a.id}" ${a.id === s.bank_account_id ? "selected" : ""}>${esc(a.account_name)}</option>`).join("")}</select>`
          : esc(acctName(s.bank_account_id))}</td>
        <td>${day(s.received_date)}</td><td>${state(s)}</td><td class="num">${s.transaction_count}</td>
        <td class="row">${s.source === "gmail" && s.has_attachment ? `<button class="small parse" data-id="${s.id}">${s.state === "parsed" ? "Re-parse" : "Parse"}</button>` : ""}
          <button class="secondary small del" data-id="${s.id}">Delete</button></td></tr>`).join("") || empty(6, "No statements yet — import some on the Import page.");

      $$(".ba").forEach(sel => sel.addEventListener("change", async () => {
        try { await api.assignStatement(sel.dataset.id, { bank_account_id: Number(sel.value) || null }); flash("Saved."); }
        catch (e) { flash(e.message, "err"); }
      }));
      $$(".parse").forEach(b => b.addEventListener("click", async () => {
        const pdf_password = prompt("PDF password (leave blank if none or already saved):");
        if (pdf_password === null) return;
        const save_password = !!pdf_password && confirm("Save this password for next time?");
        b.disabled = true;
        try { flash((await api.parseStatement(b.dataset.id, { pdf_password, save_password })).message); load(); }
        catch (e) { flash(e.message, "err"); b.disabled = false; }
      }));
      bindDelete();
    }

    function bindDelete() {
      $$(".del:not([data-bound])").forEach(b => {
        b.dataset.bound = 1;
        b.addEventListener("click", async () => {
          if (!confirm("Delete this statement? Transactions already imported from it are kept.")) return;
          try { await api.deleteStatement(b.dataset.id); loadInbox(); load(); } catch (e) { flash(e.message, "err"); }
        });
      });
    }

    Promise.all([loadInbox(), load()]).catch(e => flash(e.message, "err"));
  </script>
</body>
</html>
