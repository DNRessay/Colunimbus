<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Complete your profile — L-Suite</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="narrow">
    <div class="card">
      <h1>A couple more details</h1>
      <div id="msg"></div>
      <form id="form">
        <div class="field"><label>Occupation</label><input name="occupation" required /></div>
        <div class="field"><label>City</label><input name="city" required /></div>
        <div class="field"><label>Province</label><input name="province" /></div>
        <div class="field"><label>Country</label><input name="country" value="South Africa" /></div>
        <button type="submit" style="width:100%">Continue</button>
      </form>
    </div>
  </main>
  <script type="module">
    import { api, tokens } from "/js/api.js";
    import { $, onSubmit } from "/js/ui.js";
    if (!tokens.isLoggedIn()) location.href = "/login.html";
    onSubmit($("#form"), async (d) => {
      await api.updateProfile(d);
      location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
