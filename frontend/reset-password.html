<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — C.T.H.A.I</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="narrow">
    <img src="/logo.png" alt="CT Holdings and Investment" class="guest-logo" />
    <div class="card">
      <h1 id="title">Reset your password</h1>
      <div id="msg"></div>
      <form id="request-form">
        <div class="field"><label>Email</label><input name="email" type="email" required /></div>
        <button type="submit" style="width:100%">Send reset link</button>
      </form>
      <form id="confirm-form" hidden>
        <div class="field"><label>New password</label><input name="new_password" type="password" required minlength="8" autocomplete="new-password" /></div>
        <button type="submit" style="width:100%">Set new password</button>
      </form>
      <p class="muted" style="font-size:0.85rem"><a href="/login.html">Back to log in</a></p>
    </div>
  </main>
  <script type="module">
    import { api } from "/js/api.js";
    import { $, flash, onSubmit, param } from "/js/ui.js";
    const token = param("token");
    if (token) {
      $("#title").textContent = "Set a new password";
      $("#request-form").hidden = true;
      $("#confirm-form").hidden = false;
    }
    onSubmit($("#request-form"), async (d) => flash((await api.requestReset(d.email)).message));
    onSubmit($("#confirm-form"), async (d) => {
      await api.confirmReset({ token, new_password: d.new_password });
      flash("Password reset — you can log in now.");
      setTimeout(() => (location.href = "/login.html"), 1500);
    });
  </script>
</body>
</html>
