<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — C.T.H.A.I</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="narrow">
    <img src="/logo.png" alt="CT Holdings and Investment" class="guest-logo" />
    <div class="card">
      <h1>Set up your organisation</h1>
      <div id="msg"></div>
      <form id="form">
        <div class="field"><label>Organisation / group name</label><input name="practice_name" placeholder="e.g. Mokoena Group" /></div>
        <div class="fields">
          <div class="field"><label>First name</label><input name="first_name" required /></div>
          <div class="field"><label>Last name</label><input name="last_name" required /></div>
        </div>
        <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" /></div>
        <div class="field"><label>Username</label><input name="username" required autocomplete="username" /></div>
        <div class="field"><label>Password</label><input name="password" type="password" required minlength="8" autocomplete="new-password" /></div>
        <button type="submit" style="width:100%">Register</button>
      </form>
      <div id="access" hidden>
        <h2 style="margin-top:1.25rem">Request access</h2>
        <p class="muted">Sign-up is open to registered organisations only. Send a request and we'll email you once yours is added.</p>
        <form id="access-form">
          <div class="field"><label>Your name</label><input name="name" required /></div>
          <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" /></div>
          <div class="field"><label>Company</label><input name="company" /></div>
          <div class="field"><label>Message (optional)</label><textarea name="message" rows="3" maxlength="2000"></textarea></div>
          <button type="submit" style="width:100%">Send request</button>
        </form>
      </div>
      <p class="muted" style="font-size:0.85rem"><a href="#" id="show-access">Request access</a> · Joining an existing organisation? Ask its owner to add you under Settings. · <a href="/login.html">Log in</a></p>
    </div>
  </main>
  <script type="module">
    import { api, tokens } from "/js/api.js";
    import { $, flash, guestPage, onSubmit } from "/js/ui.js";
    guestPage();
    onSubmit($("#form"), async (d) => {
      try {
        const r = await api.register(d);
        tokens.set(r.access, r.refresh);
        location.href = "/companies.html?first=1";
      } catch (e) {
        flash(e.message, "err");
        if (/isn't registered/.test(e.message)) showAccess(d);
      }
    });
    function showAccess(d = {}) {
      const f = $("#access-form");
      f.name.value ||= [d.first_name, d.last_name].filter(Boolean).join(" ");
      f.email.value ||= d.email || "";
      f.company.value ||= d.practice_name || "";
      $("#access").hidden = false;
      $("#access").scrollIntoView({ behavior: "smooth" });
    }
    $("#show-access").addEventListener("click", (e) => { e.preventDefault(); showAccess(Object.fromEntries(new FormData($("#form")))); });
    onSubmit($("#access-form"), async (d) => {
      const r = await api.requestAccess(d);
      flash(r.message, "ok");
      $("#access").hidden = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
