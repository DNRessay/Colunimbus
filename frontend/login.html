<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — C.T.H.A.I</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="narrow">
    <img src="/logo.png" alt="CT Holdings and Investment" class="guest-logo" />
    <div class="card">
      <h1>Log in</h1>
      <div id="msg"></div>
      <form id="form">
        <div class="field"><label for="username">Username or email</label><input id="username" name="username" required autocomplete="username" /></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" /></div>
        <button type="submit" style="width:100%">Log in</button>
      </form>
      <div id="social" class="social"></div>
      <p class="muted" style="font-size:0.85rem">No account? <a href="/register.html">Register</a> · <a href="/reset-password.html">Forgot password?</a></p>
    </div>
  </main>
  <script type="module">
    import { api, tokens } from "/js/api.js";
    import { $, flash, guestPage, onSubmit, param } from "/js/ui.js";
    guestPage();

    const errors = { invalid_state: "Login link expired, try again.", oauth_failed: "Google sign-in failed.", no_account: "No account uses that Google email. Ask your organisation owner to add you." };
    if (param("error")) flash(errors[param("error")] || "Login failed.", "err");

    onSubmit($("#form"), async (d) => {
      try {
        const r = await api.login(d.username, d.password);
        tokens.set(r.access, r.refresh);
        location.href = "/dashboard.html";
      } catch (e) { flash(e.message, "err"); }
    });

    api.socialProviders().then(({ providers }) => {
      if (providers.includes("google")) $("#social").innerHTML = `<a class="btn" href="${api.googleLoginUrl()}">Continue with Google</a>`;
    }).catch(() => {});
  </script>
</body>
</html>
